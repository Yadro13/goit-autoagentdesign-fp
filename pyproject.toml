[build-system]
requires = ["setuptools==80.10.2", "wheel==0.46.3"]
build-backend = "setuptools.build_meta"

[project]
name = "riverwash-safeops-mas"
version = "1.0.0"
description = "Production-oriented multi-agent SafeOps system with reproducible sanitized fixtures"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
  "autogen-agentchat==0.7.5",
  "autogen-ext[mcp,openai]==0.7.5",
  "chromadb==1.5.9",
  "langchain==1.4.0",
  "langchain-core==1.6.2",
  "langchain-mcp-adapters==0.3.2",
  "langchain-openai==1.6.0",
  "langgraph==1.2.11",
  "langgraph-checkpoint-sqlite==3.1.1",
  "langsmith==0.12.2",
  "mcp==1.30.0",
  "pydantic==2.13.5",
  "python-dotenv==1.2.2",
]

[project.optional-dependencies]
dev = [
  "pytest==9.1.1",
  "pytest-asyncio==1.4.0",
  "pytest-cov==7.1.0",
  "ruff==0.16.6",
]

[tool.setuptools]
py-modules = [
  "evals",
  "guardrails",
  "hitl",
  "mas_autogen",
  "mas_langgraph",
  "mcp_server",
  "observability",
  "red_team",
  "tools_legacy",
  "trajectory_logger",
]

[tool.setuptools.packages.find]
include = ["safeops_core*"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests", "."]
pythonpath = ["."]
asyncio_mode = "auto"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
